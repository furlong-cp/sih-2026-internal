name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # or master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # If your Vite project is inside the 'skillbridge' subfolder:
      - name: Install dependencies & Build
        run: |
          if [ -d "skillbridge" ]; then
            cd skillbridge
            npm install
            npm run build
            cp -r dist ../dist
          else
            npm install
            npm run build
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4